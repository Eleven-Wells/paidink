name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy-vercel:
        name: Deploy API to Vercel
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v3
              with:
                  version: '10'
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - name: Deploy to Vercel
              uses: amondnet/vercel-action@v25
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
                  vercel-args: '--prod'

    deploy-worker:
        name: Deploy Worker Container
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: superfly/flyctl-actions/setup-flyctl@master
            - name: Deploy to Fly.io
              run: flyctl deploy --dockerfile worker/Dockerfile --app nook-worker --remote-only
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    health-check:
        name: Health Check
        runs-on: ubuntu-latest
        needs: [deploy-vercel, deploy-worker]
        if: success()
        steps:
            - run: |
                  sleep 15
                  echo "Checking Vercel deployment..."
                  curl -f ${{ secrets.APP_URL }}/api/health || exit 1
                  echo "Health check passed!"

    notify:
        name: Notify
        runs-on: ubuntu-latest
        needs: [deploy-vercel, deploy-worker, health-check]
        if: always()
        steps:
            - uses: slackapi/slack-github-action@v1.26.0
              with:
                  payload: |
                      {
                          "text": "Nook deployment complete (${{ inputs.environment || 'production' }})",
                          "blocks": [{
                              "type": "section",
                              "text": {
                                  "type": "mrkdwn",
                                  "text": "*Nook Deployment*\nStatus: ${{ job.status }}\nEnvironment: ${{ inputs.environment || 'production' }}"
                              }
                          }]
                      }
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
                  SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
