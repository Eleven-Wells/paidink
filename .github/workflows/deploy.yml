name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy-vercel:
        name: Deploy API to Vercel
        runs-on: ubuntu-latest
        environment: production
        outputs:
            deployment_url: ${{ steps.vercel.outputs.deployment_url }}
            vercel_raw_output: ${{ steps.vercel.outputs.vercel_raw_output }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v3
              with:
                  version: '10'
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - name: Link Vercel project
              run: |
                  mkdir -p .vercel
                  cat > .vercel/project.json <<'EOF'
                  {
                      "orgId": "${{ secrets.VERCEL_ORG_ID }}",
                      "projectId": "${{ secrets.VERCEL_PROJECT_ID }}"
                  }
                  EOF
            - name: Deploy to Vercel
              id: vercel
              run: |
                  set -e
                  DEPLOY_OUTPUT=$(npx vercel@latest deploy --prod \
                    --token=${{ secrets.VERCEL_TOKEN }} \
                    -m githubCommitSha=${{ github.sha }} \
                    -m githubCommitAuthorName=${{ github.actor }} \
                    -m githubDeployment=1 \
                    -m githubOrg=TobeChukwu278 \
                    -m githubRepo=Nook \
                    -m githubCommitRef=${{ github.ref_name }} 2>&1)
                  echo "$DEPLOY_OUTPUT"
                  DEPLOY_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[A-Za-z0-9_.-]+vercel\.app' | head -n 1 || true)
                  echo "deployment_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
                  echo "vercel_raw_output<<EOF" >> $GITHUB_OUTPUT
                  echo "$DEPLOY_OUTPUT" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

    deploy-worker:
        name: Deploy Worker Container
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: superfly/flyctl-actions/setup-flyctl@master
            - name: Deploy to Fly.io
              run: flyctl deploy --dockerfile worker/Dockerfile --app nook-worker --remote-only
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    health-check:
        name: Runtime Health Check
        runs-on: ubuntu-latest
        needs: [deploy-vercel, deploy-worker]
        if: always()
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Install dependencies
              uses: pnpm/action-setup@v3
              with:
                  version: '10'
            - name: Install packages
              run: pnpm install --frozen-lockfile
            - name: Collect runtime health snapshot
              id: collect_health
              env:
                  APP_URL: ${{ secrets.APP_URL }}
                  VERCEL_DEPLOYMENT_URL: ${{ needs.deploy-vercel.outputs.deployment_url }}
                  HEALTH_ENDPOINT: ${{ secrets.HEALTH_ENDPOINT }}
                  WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
              run: |
                  node scripts/deploy-health-report.js --collect > health.json
                  cat health.json
            - name: Upload health artifact
              uses: actions/upload-artifact@v4
              with:
                  name: runtime-health
                  path: health.json

    notify:
        name: Notify
        runs-on: ubuntu-latest
        environment: production
        needs: [deploy-vercel, deploy-worker, health-check]
        if: always()
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Install dependencies
              uses: pnpm/action-setup@v3
              with:
                  version: '10'
            - name: Install packages
              run: pnpm install --frozen-lockfile
            - name: Download health artifact
              uses: actions/download-artifact@v4
              with:
                  name: runtime-health
                  path: .
            - name: Get commit metadata
              id: commit_info
              run: |
                  echo "commit_message<<EOF" >> $GITHUB_OUTPUT
                  git log -1 --pretty=%B
                  echo "EOF" >> $GITHUB_OUTPUT
            - name: Send Discord observability report
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  APP_URL: ${{ secrets.APP_URL }}
                  VERCEL_DEPLOYMENT_URL: ${{ needs.deploy-vercel.outputs.deployment_url }}
                  GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_SHA: ${{ github.sha }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
                  GITHUB_ACTOR: ${{ github.actor }}
                  COMMIT_MESSAGE: ${{ steps.commit_info.outputs.commit_message }}
                  DEPLOY_VERCEL: ${{ needs.deploy-vercel.result }}
                  DEPLOY_WORKER: ${{ needs.deploy-worker.result }}
                  WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
                  MONITORING_DASHBOARD_URL: ${{ secrets.MONITORING_DASHBOARD_URL }}
                  OBSERVABILITY_URL: ${{ secrets.OBSERVABILITY_URL }}
                  INCIDENT_TRACKER_URL: ${{ secrets.INCIDENT_TRACKER_URL }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK_URL" ]; then
                    echo "Discord notification skipped: DISCORD_WEBHOOK_URL secret not set"
                    exit 0
                  fi
                  node scripts/deploy-health-report.js --notify --health-json=health.json
