name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy-vercel:
        name: Deploy API to Vercel
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v3
              with:
                  version: '10'
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - name: Deploy to Vercel
              uses: amondnet/vercel-action@v25
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
                  vercel-args: '--prod'

    deploy-worker:
        name: Deploy Worker Container
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: superfly/flyctl-actions/setup-flyctl@master
            - name: Deploy to Fly.io
              run: flyctl deploy --dockerfile worker/Dockerfile --app nook-worker --remote-only
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    health-check:
        name: Health Check
        runs-on: ubuntu-latest
        needs: [deploy-vercel, deploy-worker]
        if: success()
        steps:
            - run: |
                  sleep 15
                  echo "Checking Vercel deployment..."
                  curl -f ${{ secrets.APP_URL }}/api/health || exit 1
                  echo "Health check passed!"

    notify:
        name: Notify
        runs-on: ubuntu-latest
        needs: [deploy-vercel, deploy-worker, health-check]
        if: always()
        steps:
            - name: Send Discord notification
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  STATUS: ${{ job.status }}
                  ENV: ${{ inputs.environment || 'production' }}
                  DEPLOY_VERCEL: ${{ needs.deploy-vercel.result }}
                  DEPLOY_WORKER: ${{ needs.deploy-worker.result }}
                  HEALTH_CHECK: ${{ needs.health-check.result }}
              run: |
                  COLOR=$([ "$STATUS" = "success" ] && echo "5814783" || echo "15548997")
                  curl -sf -X POST "$DISCORD_WEBHOOK" \
                    -H "Content-Type: application/json" \
                    -d "{
                      \"embeds\": [{
                        \"title\": \"Nook Deployment\",
                        \"color\": $COLOR,
                        \"fields\": [
                          {\"name\": \"Status\", \"value\": \"$STATUS\", \"inline\": true},
                          {\"name\": \"Environment\", \"value\": \"$ENV\", \"inline\": true},
                          {\"name\": \"Vercel API\", \"value\": \"$DEPLOY_VERCEL\", \"inline\": true},
                          {\"name\": \"Worker\", \"value\": \"$DEPLOY_WORKER\", \"inline\": true},
                          {\"name\": \"Health Check\", \"value\": \"$HEALTH_CHECK\", \"inline\": true}
                        ],
                        \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                      }]
                    }" || echo "Discord notification failed (no webhook?)"
