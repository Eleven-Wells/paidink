version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: Nook
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: Nook
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - Nook-Network
    pull_policy: never

  redis:
    image: redis:7-alpine
    container_name: Nook-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - Nook-Network
    pull_policy: never

volumes:
  mongodb_data:
  redis_data:

networks:
  Nook-Network:
    driver: bridge
